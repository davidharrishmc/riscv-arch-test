normative_rule_definitions:
  - name: trap_del_S_mode_op
    coverpoint: ["InterruptsS/cp_priority_sie"]

  - name: mideleg_op
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  # Global interrupt-enable bits, MIE and SIE, are provided for M-mode and S-mode
  # respectively. When a hart is executing in privilege mode x, interrupts are
  # globally enabled when xIE=1 and globally disabled when xIE=0.
  # each privilege mode x that can respond to interrupts has a two-level stack of
  # interrupt-enable bits and privilege modes. xPIE holds the value of the
  # interrupt-enable bit active prior to the trap, and xPP holds the previous
  # privilege mode.
  # When a trap is taken from privilege mode y into privilege mode x, xPIE is set to
  # the value of xIE; xIE is set to 0; and xPP is set to y.
  - name: mideleg_enc
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: mstatus_tw_op
    coverpoint: ["InterruptsS/cp_wfi", "InterruptsS/cp_wfi_timeout"]

  - name: mip_enc
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: mip_bits_wr_op
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: intr_mip_mie_op
    coverpoint: ["InterruptsS/cp_priority_sip"]

  - name: intr_mip_mie_xret_csrwr
    coverpoint: ["InterruptsS/cp_priority_sip"]

  - name: intr_M_mode_highest_pri
    coverpoint: ["InterruptsS/cp_priority_sie"]

  - name: intr_sei_op
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: trap_never_trans_lower
    coverpoint: ["InterruptsS/cp_trigger"]

  - name: trap_horiz
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: trap_del_intr_priv_lvl
    coverpoint: ["InterruptsS/cp_trigger"]

  # If supervisor mode is implemented, bits mip.SEIP and mie.SEIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level external
  # interrupts.
  - name: mstatus_tw_umode_op
    coverpoint: ["InterruptsS/cp_wfi_timeout"]

  - name: mip_seip_acc
    coverpoint: ["InterruptsS/cp_trigger_reg"]

  - name: mip_seip_rdcsr
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: mip_seip_wrcsr
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: mip_stip_no_stimecmp_acc
    coverpoint: ["InterruptsS/cp_trigger"]

  - name: mip_stip_no_stimecmp_op
    coverpoint: ["InterruptsS/cp_trigger"]

  - name: mip_stip_stimecmp_op
    coverpoint: ["InterruptsS/cp_trigger"]

  - name: mip_stip_stimecmp_clr
    coverpoint: ["InterruptsS/cp_trigger"]

  - name: mip_stie_op
    coverpoint: ["InterruptsS/cp_trigger"]

  # If supervisor mode is implemented, bits mip.SSIP and mie.SSIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level software
  # interrupts.
  - name: mip_ssip_acc
    coverpoint: ["InterruptsS/cp_trigger"]

  # The SPP bit indicates the privilege level at which a hart was executing before
  # entering supervisor mode. When a trap is taken, SPP is set to 0 if the trap
  # originated from user mode, or 1 otherwise. When an SRET instruction (see ) is
  # executed to return from the trap handler, the privilege level is set to user
  # mode if the SPP bit is 0, or supervisor mode if the SPP bit is 1; SPP is then
  # set to 0.
  - name: mip_ssip_intr_ctrl
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_reg"]

  - name: mstatus_tw_always_illegal
    coverpoint: ["InterruptsS/cp_wfi_timeout"]

  - name: menvcfg-stce
    coverpoint: ["InterruptsS/cp_trigger_sti_sstc"]

  - name: mcounteren_tm_clr
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_sti_sstc"]

  - name: mcounteren_tm_set
    coverpoint: ["InterruptsS/cp_trigger", "InterruptsS/cp_trigger_sti_sstc"]

  # A supervisor timer interrupt becomes pending, as reflected in the STIP bit in
  # the mip and sip registers whenever time contains a value greater than or equal
  # to stimecmp, treating the values as unsigned integers. If the result of this
  # comparison changes, it is guaranteed to be reflected in STIP eventually, but not
  # necessarily immediately. The interrupt remains posted until stimecmp becomes
  # greater than time, typically as a result of writing stimecmp. The interrupt will
  # be taken based on the standard interrupt enable and delegation rules.
  - name: stimecmp_stimecmph_sz_acc
    coverpoint: ["InterruptsS/cp_trigger_sti_sstc"]
