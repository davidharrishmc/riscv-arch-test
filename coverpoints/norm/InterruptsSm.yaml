normative_rule_definitions:
  # Global interrupt-enable bits, MIE and SIE, are provided for M-mode and S-mode
  # respectively. When a hart is executing in privilege mode x, interrupts are
  # globally enabled when xIE=1 and globally disabled when xIE=0.
  - name: mideleg_enc
    coverpoint: ["InterruptsSm/cp_enable"]

  # each privilege mode x that can respond to interrupts has a two-level stack of
  # interrupt-enable bits and privilege modes. xPIE holds the value of the
  # interrupt-enable bit active prior to the trap, and xPP holds the previous
  # privilege mode.
  - name: mstatus_xie_intr_en_dis
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_enc
    coverpoint: ["InterruptsSm/cp_enable", "InterruptsSm/cp_priority_mip"]

  - name: mie_enc
    coverpoint: ["InterruptsSm/cp_enable", "InterruptsSm/cp_priority_mip"]

  - name: intr_mip_mie_op
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: intr_mip_mie_xret_csrwr
    coverpoint: ["InterruptsSm/cp_enable", "InterruptsSm/cp_trigger"]

  - name: intr_sei_op
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: intr_M_mode_pri
    coverpoint: ["InterruptsSm/cp_priority_mip", "InterruptsSm/cp_trigger"]

  # If supervisor mode is implemented, bits mip.SEIP and mie.SEIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level external
  # interrupts.
  - name: trap_del_intr_priv_lvl
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_seip_acc
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_seip_rdcsr
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_seip_wrcsr
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_stip_no_stimecmp_acc
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_stip_no_stimecmp_op
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_stip_stimecmp_op
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_stip_stimecmp_acc
    coverpoint: ["InterruptsSm/cp_trigger_sti_sstc"]

  - name: mip_stip_stimecmp_clr
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_stie_op
    coverpoint: ["InterruptsSm/cp_enable"]

  # If supervisor mode is implemented, bits mip.SSIP and mie.SSIE are the
  # interrupt-pending and interrupt-enable bits for supervisor-level software
  # interrupts.
  - name: mip_ssip_acc
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mip_ssip_intr_ctrl
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mepc_op
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: mcause_op
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: mcause_intr_op
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: mcause_exccode_op
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: mcause_exccode_enc
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: trap_def_M_mode
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: mtvec_mode_enc
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mtvec_mode_direct_op
    coverpoint: ["InterruptsSm/cp_enable"]

  # Global interrupt-enable bits, MIE and SIE, are provided for M-mode and S-mode
  # respectively. When a hart is executing in privilege mode x, interrupts are
  # globally enabled when xIE=1 and globally disabled when xIE=0.
  # each privilege mode x that can respond to interrupts has a two-level stack of
  # interrupt-enable bits and privilege modes. xPIE holds the value of the
  # interrupt-enable bit active prior to the trap, and xPP holds the previous
  # privilege mode.
  # When a trap is taken from privilege mode y into privilege mode x, xPIE is set to
  # the value of xIE; xIE is set to 0; and xPP is set to y.
  - name: mtvec_mode_vectored_op
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mstatus_tw_warl
    coverpoint: ["InterruptsSm/cp_wfi"]

  - name: mip_std_enc
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  - name: mie_std_enc
    coverpoint: ["InterruptsSm/cp_priority_mip"]

  # Bits mip.MEIP and mie.MEIE are the interrupt-pending and interrupt-enable bits
  # for machine-level external interrupts.
  - name: mip_bits_rdonly_op
    coverpoint: ["InterruptsSm/cp_enable"]

  # Bits mip.MTIP and mie.MTIE are the interrupt-pending and interrupt-enable bits
  # for machine timer interrupts.
  - name: mip_meip_rdonly
    coverpoint: ["InterruptsSm/cp_trigger"]

  # Bits mip.MSIP and mie.MSIE are the interrupt-pending and interrupt-enable bits
  # for machine-level software interrupts.
  - name: mip_mtip_rdonly
    coverpoint: ["InterruptsSm/cp_trigger"]

  # A hart's memory-mapped msip register is a 32-bit read/write register
  - name: mip_msip_rdonly
    coverpoint: ["InterruptsSm/cp_trigger"]

  - name: msip_enc
    coverpoint: ["InterruptsSm/cp_trigger", "InterruptsSm/cp_trigger_reg"]

  - name: msip_update_max_time
    coverpoint: ["InterruptsSm/cp_trigger"]

  - name: intr_mip_mie_bounded_time
    coverpoint: ["InterruptsSm/cp_enable"]

  - name: mstatus_tw_time_limit
    coverpoint: ["InterruptsSm/cp_wfi", "InterruptsSm/cp_wfi_timeout"]

  # each privilege mode x that can respond to interrupts has a two-level stack of
  # interrupt-enable bits and privilege modes. xPIE holds the value of the
  # interrupt-enable bit active prior to the trap, and xPP holds the previous
  # privilege mode.
  # When a trap is taken from privilege mode y into privilege mode x, xPIE is set to
  # the value of xIE; xIE is set to 0; and xPP is set to y.
  - name: mstatus_tw_always_illegal
    coverpoint: ["InterruptsSm/cp_wfi_timeout"]

  - name: mstatus_tw_op
    coverpoint: ["InterruptsSm/cp_wfi", "InterruptsSm/cp_wfi_timeout"]
