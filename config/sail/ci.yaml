# CI configuration for Sail reference model

ci_enabled: true
# Check each config's UDB yaml against the simulator with the UDB feature extractor
feature_extractor: true
exclude_extensions: "SdtrigSm,SdtrigS,SdtrigU"
shards: 1
config_shards:
  sail-RVA22S64-optional: 2
  sail-RVA23S64: 2
  sail-RVA23S64-optional: 2
  sail-RVB23S64-optional: 2
  sail-rv32-max: 4
  sail-rv32-max-clang: 4
  sail-rv64-max: 4
  sail-rv64-max-clang: 4
