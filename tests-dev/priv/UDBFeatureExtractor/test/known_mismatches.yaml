#
# Known mismatches between what the UDB feature extractor measures on a configuration's simulator
# and what the configuration's UDB yaml declares.  regression.py accepts the ones listed here; any
# other mismatch fails it, and so does a listed one that no longer occurs, so remove an entry when
# its cause is fixed.
#
#   <configuration>:
#     <extension or parameter>: "<class>: <reason>"
#
# class is one of
#   config     the UDB yaml (or run_cmd.txt) declares something the simulator does not do
#   simulator  the simulator is wrong: it breaks the spec or ignores its own configuration
#   udb        the UDB schema cannot describe what the simulator does
#   extractor  the extractor measures the item wrongly or inconclusively

qemu-RVI20U32:
  B: "config: Zba, Zbb and Zbs are on by default in -cpu rv32/rv64; run_cmd.txt does not disable them"
  H: "config: QEMU -cpu rv32/rv64 sets misa S, U and H by default; run_cmd.txt does not clear them"
  S: "config: QEMU -cpu rv32/rv64 sets misa S, U and H by default; run_cmd.txt does not clear them"
  Sdtrig: "config: QEMU debug=true by default gives Sdtrig (tinfo); run_cmd.txt does not set debug=false"
  Sha: "extractor: Sha is derived without Ssstateen, which Sha requires and QEMU -cpu rv32/rv64 lacks"
  Shcounterenw: "config: follows from misa.H, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Shgatpa: "config: follows from misa.H, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Shvsatpa: "config: follows from misa.H, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Shvstvecd: "config: follows from misa.H, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Sscounterenw: "config: follows from misa.S, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Sstc: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Sstvecd: "config: follows from misa.S, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Sstvecv: "config: follows from misa.S, on by default in -cpu rv32/rv64; run_cmd.txt does not clear it"
  Sv32: "config: QEMU mmu=true by default, so satp accepts Bare and SvNN; run_cmd.txt does not set mmu=false"
  Svade: "config: Svade follows Svadu (menvcfg.ADUE), on by default in -cpu rv32/rv64; run_cmd.txt leaves it"
  Svadu: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Svbare: "config: QEMU mmu=true by default, so satp accepts Bare and SvNN; run_cmd.txt does not set mmu=false"
  U: "config: QEMU -cpu rv32/rv64 sets misa S, U and H by default; run_cmd.txt does not clear them"
  Zawrs: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zba: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zbb: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zbc: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zbkc: "config: clmul executes via Zbc, on by default in -cpu rv32/rv64; run_cmd.txt does not disable it"
  Zbs: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zfa: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zicbom: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zicboz: "config: QEMU 11.1 -cpu rv32/rv64 enables this by default; run_cmd.txt does not disable it"
  Zihpm: "config: -cpu rv32/rv64 has Zihpm and pmu-mask=0xfffffff8 makes 29 counters; yaml omits it"
  ARCH_ID_VALUE: "config: marchid reads 42 (QEMU's fixed value); yaml differs"
  COUNTINHIBIT_EN: "config: mcountinhibit bits 3-31 are writable (pmu-mask=0xfffffff8); yaml says read-only 0"
  HPM_COUNTER_EN: "config: mhpmcounter3-31 exist (pmu-mask=0xfffffff8 in run_cmd.txt); yaml has no HPM counters"
  LRSC_FAIL_ON_VA_SYNONYM: "config: SC compares the LR's virtual address, so an SC through a VA synonym fails; yaml says false"
  LRSC_MISALIGNED_BEHAVIOR: "config: misaligned lr.w raises load address-misaligned; yaml (and sail.json) say access fault"
  MCOUNTENABLE_EN: "config: mcounteren bits 3-31 are writable (pmu-mask=0xfffffff8); yaml says read-only 0"
  MIMPID_IMPLEMENTED: "extractor: mimpid is implemented as 0; the probe infers unimplemented from a zero read"
  MISALIGNED_LDST_EXCEPTION_PRIORITY: "config: misaligned AMO traps as misaligned before translation (high); yaml says low"
  MISALIGNED_SPLIT_STRATEGY: "config: page-crossing store translates both pages first, writes no byte on a fault; yaml says sequential"
  NUM_PMP_ENTRIES: "config: QEMU pmp=true by default: pmpaddr0-63 exist, 16 usable; yaml says 0"
  PHYS_ADDR_WIDTH: "config: RV32 pmpaddr keeps all 32 bits, so PAs are 34 bits (Sv32 on by default); yaml says 32"

