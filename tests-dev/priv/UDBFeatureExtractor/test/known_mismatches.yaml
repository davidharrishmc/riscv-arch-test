sail-RVA20S64:
  Sscounterenw: "config: scounteren is fully writable, so Sscounterenw holds; yaml omits it"
  Sstvecv: "config: stvec accepts Vectored mode (yaml STVEC_MODES has 1); yaml omits Sstvecv"
  ARCH_ID_VALUE: "config: marchid reads 0 (sail.json platform.archid 0); yaml says 0x1"
  LRSC_RESERVATION_STRATEGY: "config: SC succeeds anywhere in LR's aligned 8-byte set (reservation_set_size_exp 3); yaml says exact"
  MARCHID_IMPLEMENTED: "config: marchid reads 0; yaml declares a nonzero ARCH_ID_VALUE"
  MIMPID_IMPLEMENTED: "extractor: mimpid is implemented as 0; the probe infers unimplemented from a zero read"
  PMP_GRANULARITY: "extractor: the probe prints G, not G+2; the yaml's 2 (a 4-byte grain) is right"

