qemu-rv32-max:
  Q: "config: QEMU 11.1.1 does not implement Q; yaml declares it"
  Ssube: "config: sstatus.UBE is read-only 0 (endianness is fixed at reset); yaml declares Ssube"
  Zilsd: "config: QEMU max CPU turns Zilsd off and run_cmd.txt does not enable it; yaml declares it"
  ARCH_ID_VALUE: "config: marchid reads 42 (QEMU's fixed value); yaml differs"
  DBG_HCONTEXT_WIDTH: "config: mcontext.HCONTEXT is 7 bits on RV32 with H; yaml says 14"
  HCONTEXT_AVAILABLE: "config: QEMU does not implement the hcontext CSR; yaml says it is available"
  HSTATEEN_CONTEXT_TYPE: "config: hstateen0.CONTEXT (bit 57) is not in QEMU's write mask, so read-only 0; yaml says rw"
  IMP_ID_VALUE: "config: mimpid reads 0; yaml says 0x100"
  LRSC_FAIL_ON_VA_SYNONYM: "config: SC compares the LR's virtual address, so an SC through a VA synonym fails; yaml says false"
  MIMPID_IMPLEMENTED: "config: mimpid reads 0; yaml says 0x100"
  MISALIGNED_AMO: "extractor: the amoadd.w probe at +2 stays in a 16-byte granule, which Zama16b makes legal"
  MISALIGNED_SPLIT_STRATEGY: "config: page-crossing store translates both pages first, writes no byte on a fault; yaml says sequential"
  MSTATEEN_CONTEXT_TYPE: "config: mstateen0.CONTEXT (bit 57) is not in QEMU's write mask, so read-only 0; yaml says rw"
  MUTABLE_MISA_B: "config: misa is read-only (x-misa-w=false by default); yaml says misa.B is writable"
  M_MODE_ENDIANNESS: "config: mstatus MBE/SBE/UBE are read-only (fixed by big-endian at reset); yaml says dynamic"
  NUM_EXTERNAL_GUEST_INTERRUPTS: "udb: virt without aia=aplic-imsic has GEILEN 0 (aia-guests allows 1-7); UDB requires at least 1"
  NUM_PMP_ENTRIES: "config: pmpaddr0-63 all exist (16 usable, the rest read 0); yaml says 16"
  PMP_GRANULARITY: "extractor: the probe prints G, not G+2; the yaml's 2 (a 4-byte grain) is right"
  RESERVED_VSET_X0X0_VILL_SET: "config: vsetvli x0,x0 sets vill only with rvv_vsetvl_x0_vill=true and a vl change; yaml says always"
  RESERVED_VSET_X0X0_VLMAX_CHANGE: "config: vsetvli x0,x0 sets vill only with rvv_vsetvl_x0_vill=true and a vl change; yaml says always"
  S_MODE_ENDIANNESS: "config: mstatus MBE/SBE/UBE are read-only (fixed by big-endian at reset); yaml says dynamic"
  TINST_VALUE_ON_LOAD_ACCESS_FAULT: "config: htinst gets a transformed load/store on access faults; yaml says always zero"
  TINST_VALUE_ON_STORE_AMO_ACCESS_FAULT: "config: htinst gets a transformed load/store on access faults; yaml says always zero"
  U_MODE_ENDIANNESS: "config: mstatus MBE/SBE/UBE are read-only (fixed by big-endian at reset); yaml says dynamic"
  VECTOR_LS_SEG_PARTIAL_ACCESS: "config: a faulting segment store writes the fields before the faulting one; yaml says false"
  VENDOR_ID_BANK: "config: mvendorid reads 0; yaml says bank 0xC, offset 2"
  VENDOR_ID_OFFSET: "config: mvendorid reads 0; yaml says bank 0xC, offset 2"
  VFREDUSUM_FINAL_NODE_ELEMENT_BEHAVIOR: "extractor: the -0.0 probe runs under RNE, where copy and the additive identity (-0.0) agree; prints copy"
  VFREDUSUM_INACTIVE_NODE_ELEMENT_BEHAVIOR: "extractor: the -0.0 probe runs under RNE, where copy and the additive identity (-0.0) agree; prints copy"
  VU_MODE_ENDIANNESS: "simulator: vsstatus.UBE is writable, but VU-mode accesses stay little-endian (mstatus.UBE)"

